name: Windows UI Patcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'switch_ui/**'
      - '.github/workflows/windows-patcher.yml'
jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test patcher
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build self-contained Windows patcher
        run: >
          pyinstaller --clean --noconfirm --onefile --windowed
          --name Eden-UI-Patcher
          --add-data "switch_ui;switch_ui"
          tools/patcher_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: Eden-UI-Patcher-Windows
          path: dist/Eden-UI-Patcher.exe
          if-no-files-found: error
          retention-days: 30
