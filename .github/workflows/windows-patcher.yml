name: Windows UI Patcher Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'switch_ui/**'
      - 'installer/**'
      - '.github/workflows/windows-patcher.yml'

jobs:
  package-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run patcher tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Package self-contained graphical patcher
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name Switch-Interface-Patcher --add-data "switch_ui;switch_ui" tools/patcher_gui.py
          if (!(Test-Path 'dist/Switch-Interface-Patcher.exe')) { throw 'Missing patcher EXE' }
      - name: Find or install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 compiler unavailable' }
          & $iscc 'installer/switch-interface.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          if (!(Test-Path 'installer-dist/Switch-Interface-Setup.exe')) { throw 'Installer output not found' }
      - name: Upload full Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Interface-Installer-Windows
          path: installer-dist/Switch-Interface-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload standalone patcher EXE
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Interface-Patcher-Portable
          path: dist/Switch-Interface-Patcher.exe
          if-no-files-found: error
          retention-days: 30
